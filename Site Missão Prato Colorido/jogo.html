<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monte seu prato | Missão Prato Colorido</title>
  <link rel="stylesheet" href="global.css">
  <link rel="stylesheet" href="jogo.css">
</head>
<body>

  <header class="cabecalho">
    <div class="container">
      <a class="marca" href="index.html">Missão Prato Colorido</a>
    </div>
  </header>

  <main>
    <section class="jogo-topo">
      <div class="container">
        <a class="voltar" href="index.html">Voltar para o início</a>
        <h1>Monte seu prato</h1>
        <p>Toque nos alimentos para colocá-los no prato, ou arraste até ele. Para tirar um alimento, toque nele de novo. Quando terminar, aperte em confirmar.</p>
      </div>
    </section>

    <section class="secao" style="padding-top: 1rem;">
      <div class="container jogo-area">

        <div class="prato-jogo">
          <div class="prato-mesa" id="prato" aria-label="Seu prato">
            <p class="prato-vazio" id="prato-vazio"></p>
            <div class="prato-comidas" id="prato-comidas"></div>
          </div>

          <div class="controles">
            <button class="botao" type="button" id="confirmar">Confirmar prato</button>
            <button class="botao-sec" type="button" id="recomecar">Recomeçar</button>
          </div>

          <div class="resultado" id="resultado" role="status" aria-live="polite"></div>

          <!-- Só aparece quando a criança vence o jogo -->
          <a class="botao" id="proximo" href="proxima-pagina.html" hidden>Ir para a próxima página</a>
        </div>

        <ul class="bancada" id="bancada" aria-label="Alimentos disponíveis"></ul>

      </div>
    </section>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>Missão Prato Colorido</p>
    </div>
  </footer>

  <script>
    // 11 alimentos bons e 6 ruins. Para trocar algum, mude "bom" e o nome da imagem.
    const comidas = [
      { id: "alface",     nome: "Alface",         bom: true },
      { id: "tomate",     nome: "Tomate",         bom: true },
      { id: "brocolis",   nome: "Brócolis",       bom: true },
      { id: "cenoura",    nome: "Cenoura",        bom: true },
      { id: "beterraba",  nome: "Beterraba",      bom: true },
      { id: "milho",      nome: "Milho",          bom: true },
      { id: "feijao",     nome: "Feijão",         bom: true },
      { id: "arroz",      nome: "Arroz",          bom: true },
      { id: "frango",     nome: "Frango grelhado", bom: true },
      { id: "carne",      nome: "Carne moída",    bom: true },
      { id: "ovo",        nome: "Ovo frito",      bom: true },
      { id: "batata",     nome: "Batata frita",   bom: false },
      { id: "hamburguer", nome: "Hambúrguer",     bom: false },
      { id: "chocolate",  nome: "Chocolate",      bom: false },
      { id: "biscoito",   nome: "Biscoito",       bom: false },
      { id: "rosquinha",  nome: "Rosquinha",      bom: false },
      { id: "bolo",       nome: "Bolo",           bom: false }
    ];

    const bancada = document.getElementById("bancada");
    const prato = document.getElementById("prato");
    const pratoComidas = document.getElementById("prato-comidas");
    const pratoVazio = document.getElementById("prato-vazio");
    const resultado = document.getElementById("resultado");
    const proximo = document.getElementById("proximo");

    let noPrato = []; // ids dos alimentos que estão no prato

    // Embaralha para os alimentos bons e ruins não ficarem agrupados
    const ordem = [...comidas].sort(() => Math.random() - 0.5);

    function criarBotao(c, doPrato) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "alimento";
      b.draggable = true;
      b.dataset.id = c.id;
      b.innerHTML = `<img src="${c.id}.png" alt="">` + (doPrato ? "" : `<span>${c.nome}</span>`);
      b.setAttribute("aria-label", doPrato ? `Tirar ${c.nome} do prato` : `Colocar ${c.nome} no prato`);
      b.addEventListener("dragstart", e => e.dataTransfer.setData("text/plain", c.id));
      b.addEventListener("click", () => doPrato ? tirar(c.id) : colocar(c.id));
      return b;
    }

    // Monta a bancada uma vez
    ordem.forEach(c => {
      const li = document.createElement("li");
      li.dataset.id = c.id;
      li.appendChild(criarBotao(c, false));
      bancada.appendChild(li);
    });

    function atualizar() {
      bancada.querySelectorAll("li").forEach(li => {
        li.hidden = noPrato.includes(li.dataset.id);
      });
      pratoComidas.replaceChildren(
        ...noPrato.map(id => criarBotao(comidas.find(c => c.id === id), true))
      );
      pratoVazio.hidden = noPrato.length > 0;
      resultado.className = "resultado";
      resultado.replaceChildren();
      proximo.hidden = true; // qualquer mudança no prato esconde o botão até confirmar de novo
    }

    function colocar(id) {
      if (!noPrato.includes(id)) { noPrato.push(id); atualizar(); }
    }

    function tirar(id) {
      noPrato = noPrato.filter(x => x !== id);
      atualizar();
    }

    // Arrastar e soltar (no celular, use o toque)
    function zonaDeSoltar(el, aoSoltar) {
      el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("sobre"); });
      el.addEventListener("dragleave", () => el.classList.remove("sobre"));
      el.addEventListener("drop", e => {
        e.preventDefault();
        el.classList.remove("sobre");
        aoSoltar(e.dataTransfer.getData("text/plain"));
      });
    }
    zonaDeSoltar(prato, colocar);
    zonaDeSoltar(bancada, tirar);

    function mostrar(classe, titulo, texto) {
      resultado.className = "resultado " + classe;
      resultado.innerHTML = `${titulo}<p>${texto}</p>`;
    }

    document.getElementById("confirmar").addEventListener("click", () => {
      if (noPrato.length === 0) {
        mostrar("melhorar", "Seu prato está vazio", "Escolha alguns alimentos e tente de novo.");
        proximo.hidden = true;
        return;
      }
      const soBons = noPrato.every(id => comidas.find(c => c.id === id).bom);
      if (soBons) {
        mostrar("venceu", "Ótimo prato!", "Você montou um prato colorido e cheio de coisas boas.");
        proximo.hidden = false; // só aparece quando vence
      } else {
        mostrar("melhorar", "Esse prato dá para melhorar", "Tire alguns alimentos, escolha outros e confirme de novo.");
        proximo.hidden = true;
      }
    });

    document.getElementById("recomecar").addEventListener("click", () => {
      noPrato = [];
      atualizar();
    });

    atualizar();
  </script>

</body>
</html>
